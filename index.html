<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube View Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f7;
      color: #222;
    }

    header {
      background: #111;
      color: #fff;
      padding: 28px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 8px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    .status {
      background: #fff;
      border-radius: 14px;
      padding: 15px 18px;
      margin-bottom: 18px;
      font-size: 13px;
      color: #666;
    }

    .video {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .views {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .views span {
      font-size: 14px;
      font-weight: 500;
      color: #777;
    }

    .updated {
      font-size: 12px;
      color: #888;
    }

    .growth {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #eee;
      font-size: 14px;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
      color: #888;
    }

    .error {
      background: #fff0f0;
      color: #b00020;
      padding: 16px;
      border-radius: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <h1>YouTube View Tracker</h1>
  <p>Automatic view count tracking</p>
</header>

<main>
  <div class="status" id="status">
    Loading data...
  </div>

  <div id="videos"></div>
</main>

<script>
  async function loadData() {
    const status = document.getElementById("status");
    const container = document.getElementById("videos");

    try {
      const response = await fetch(
        "views.json?t=" + Date.now()
      );

      if (!response.ok) {
        throw new Error("Data could not be loaded.");
      }

      const data = await response.json();

      const videos = Object.values(data);

      if (videos.length === 0) {
        container.innerHTML = `
          <div class="empty">
            No videos have been registered yet.
          </div>
        `;
        status.textContent = "No tracking data";
        return;
      }

      videos.sort((a, b) => {
        const aLast =
          a.history?.[a.history.length - 1]?.views || 0;

        const bLast =
          b.history?.[b.history.length - 1]?.views || 0;

        return bLast - aLast;
      });

      container.innerHTML = videos.map(video => {
        const history = video.history || [];

        const latest =
          history[history.length - 1];

        const previous =
          history.length >= 2
            ? history[history.length - 2]
            : null;

        const currentViews =
          latest?.views || 0;

        const increase =
          previous
            ? currentViews - previous.views
            : 0;

        const updated =
          latest?.date
            ? new Date(latest.date).toLocaleString("ja-JP")
            : "—";

        return `
          <div class="video">

            <div class="title">
              ${escapeHTML(video.title)}
            </div>

            <div class="views">
              ${currentViews.toLocaleString()}
              <span>views</span>
            </div>

            <div class="updated">
              Last updated: ${updated}
            </div>

            <div class="growth">
              ${
                previous
                  ? `Since last update: +${increase.toLocaleString()} views`
                  : "First recorded value"
              }
            </div>

          </div>
        `;
      }).join("");

      status.textContent =
        `${videos.length} video${videos.length === 1 ? "" : "s"} tracked`;

    } catch (error) {
      console.error(error);

      status.textContent = "Unable to load tracking data";

      container.innerHTML = `
        <div class="error">
          Tracking data could not be loaded.
        </div>
      `;
    }
  }

  function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  loadData();

  setInterval(loadData, 5 * 60 * 1000);
</script>

</body>
</html>
